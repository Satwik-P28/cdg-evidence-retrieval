name: CDG R77 trained verifier prompt framing
on:
  push:
    branches:
      - "research/round-77-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  prompt-framing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned CPU Torch and trained detector dependencies
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install --disable-pip-version-check lettucedetect==0.2.3 transformers==4.52.4 huggingface_hub==0.32.4 tokenizers==0.21.4 numpy==2.2.6
      - name: R77 response-offset, input-framing and paired metric regression tests
        run: python -W error::ResourceWarning -m unittest discover -s experiments/round-77 -p 'test_*.py' -v
      - name: R77 same human QA and Summary response under two frozen prompt formats
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: python experiments/round-77/prompt_framing.py --out experiments/round-77/ci-results.json
      - name: Publish paired prompt-framing aggregate numerical outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round77-trained-verifier-framing-results
          path: experiments/round-77/ci-results.json
          if-no-files-found: ignore
