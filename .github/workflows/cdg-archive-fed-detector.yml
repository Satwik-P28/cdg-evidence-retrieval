name: CDG R78 archived source to trained grounding verifier
on:
  push:
    branches:
      - "research/round-78-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  archive-fed-grounding:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin CPU detector runtime and third-party dependencies
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install --disable-pip-version-check lettucedetect==0.2.3 transformers==4.52.4 huggingface_hub==0.32.4 tokenizers==0.21.4 numpy==2.2.6
      - name: R78 reversible byte-prefix and metric regression tests
        run: python -W error::ResourceWarning -m unittest discover -s experiments/round-78 -p 'test_*.py' -v
      - name: R78 SHA-verified archive-fed and original trained detector paired run
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: python experiments/round-78/archived_detector.py --out experiments/round-78/ci-results.json
      - name: Archive only aggregate costs and metrics, never third-party passages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round78-archive-fed-human-grounding-metrics
          path: experiments/round-78/ci-results.json
          if-no-files-found: ignore
