name: CDG R94 actual retrieved source NLI verdict yield
on:
  push:
    branches:
      - "research/round-94-*"
    paths:
      - "experiments/round-94/**"
      - ".github/workflows/cdg-r94-retrieved-verdicts.yml"
  workflow_dispatch:
jobs:
  source-grounded-verdicts:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned public pretrained NLI CPU inference packages
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install --disable-pip-version-check transformers==4.52.4 huggingface_hub==0.32.4 tokenizers==0.21.4 numpy==2.2.6 sentencepiece==0.2.0 protobuf==5.29.5
      - name: Eight provenance and unannotated-source label-scoping regressions
        run: python -W error::ResourceWarning -m unittest discover -s experiments/round-94 -p 'test_*.py' -v
      - name: Full SciFact source-exact retrieval and pinned three-way NLI verdict scoring
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: python experiments/round-94/retrieved_verdicts.py --out experiments/round-94/ci-results.json
      - name: Retain original source SHA, aggregate verdicts and model costs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdg-r94-source-grounded-verdict-results
          path: experiments/round-94/ci-results.json
          if-no-files-found: ignore
