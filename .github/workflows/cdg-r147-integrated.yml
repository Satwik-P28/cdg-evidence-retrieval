name: CDG R147 integrated transactional archive
on:
  push:
    branches: ['research/round-147-*']
    paths: ['experiments/round-147/**','.github/workflows/cdg-r147-integrated.yml','research/rounds/round-147/**']
  workflow_dispatch:
jobs:
  integrated:
    strategy:
      fail-fast: false
      matrix:
        target: [10000, 100000]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install zstandard==0.25.0 pytest==9.0.2 gdown==5.2.0 pyflakes==3.4.0
      - run: python -m pyflakes experiments/round-147
      - run: cc -O3 -Wall -Wextra -Werror -shared -fPIC experiments/round-118/cdgfts.c -o experiments/round-118/cdgfts.so
      - run: CDG_FTS_EXTENSION="$PWD/experiments/round-118/cdgfts.so" PYTHONPATH=experiments/round-147 python -m pytest -q experiments/round-147
      - run: python experiments/round-136/download_source.py --out external/newsedits
      - run: python experiments/round-147/integrated_pack.py --source external/newsedits/ap.db --target ${{ matrix.target }} --extension experiments/round-118/cdgfts.so --out experiments/round-147/ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: cdg-r147-${{ matrix.target }}
          path: experiments/round-147/ci.json
