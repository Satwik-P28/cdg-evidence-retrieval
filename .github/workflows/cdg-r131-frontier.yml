name: CDG R131 budget and codec frontier
on:
  push:
    branches: ['research/round-131-*']
    paths: ['experiments/round-131/**','.github/workflows/cdg-r131-frontier.yml','research/rounds/round-131/**']
  pull_request:
    paths: ['experiments/round-131/**','.github/workflows/cdg-r131-frontier.yml','research/rounds/round-131/**']
  workflow_dispatch:
jobs:
  corpus:
    strategy:
      fail-fast: false
      matrix:
        include:
          - corpus: cpython
            repository: python/cpython
            pin: 60403a5409ff2c3f3b07dd2ca91a7a3e096839c7
          - corpus: bips
            repository: bitcoin/bips
            pin: 0d99ffd39fdaf75209c43b1f8ec3fbbc23f10814
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y xdelta3
      - run: pip install zstandard==0.25.0 pytest==9.0.2
      - run: cc -O3 -Wall -Wextra -Werror -shared -fPIC experiments/round-118/cdgfts.c -o experiments/round-118/cdgfts.so
      - run: CDG_FTS_EXTENSION="$PWD/experiments/round-118/cdgfts.so" PYTHONPATH=experiments/round-131 python -m pytest -q experiments/round-131
      - name: Fetch pinned Git ancestry (blobless)
        env:
          UPSTREAM: ${{ matrix.repository }}
          PIN: ${{ matrix.pin }}
        run: |
          mkdir -p external/history
          git -C external/history init
          git -C external/history remote add origin "https://github.com/$UPSTREAM.git"
          git -C external/history config remote.origin.promisor true
          git -C external/history config remote.origin.partialclonefilter blob:none
          git -C external/history -c protocol.version=2 fetch --filter=blob:none --no-tags --depth=12000 origin "$PIN"
          test "$(git -C external/history rev-parse FETCH_HEAD)" = "$PIN"
      - name: Matched delta archive comparison
        env:
          CORPUS: ${{ matrix.corpus }}
        run: python experiments/round-131/budget_archive.py --root external/history --corpus "$CORPUS" --extension experiments/round-118/cdgfts.so --out "experiments/round-131/ci-$CORPUS.json"
      - name: Source-only VCDIFF screen
        env:
          CORPUS: ${{ matrix.corpus }}
        run: python experiments/round-131/vcdiff_screen.py --root external/history --corpus "$CORPUS" --out "experiments/round-131/vcdiff-$CORPUS.json"
      - uses: actions/upload-artifact@v4
        with:
          name: cdg-r131-${{ matrix.corpus }}
          path: |
            experiments/round-131/ci-${{ matrix.corpus }}.json
            experiments/round-131/vcdiff-${{ matrix.corpus }}.json
