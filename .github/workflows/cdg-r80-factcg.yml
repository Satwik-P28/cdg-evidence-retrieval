name: CDG R80 FactCG graph-trained checker replication
on:
  push:
    branches:
      - "research/round-80-*"
    paths:
      - "experiments/round-80/factcg_control.py"
      - "experiments/round-80/test_factcg_control.py"
      - ".github/workflows/cdg-r80-factcg.yml"
  workflow_dispatch:
jobs:
  graph-grounding-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned CPU inference environment
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install --disable-pip-version-check transformers==4.52.4 huggingface_hub==0.32.4 tokenizers==0.21.4 numpy==2.2.6 sentencepiece==0.2.0 protobuf==5.29.5
      - name: Validate FactCG prompt and unchanged 120-case benchmark identity
        run: python -W error::ResourceWarning -m unittest discover -s experiments/round-80 -p 'test_factcg_control.py' -v
      - name: FactCG pretrained checkpoint on 120 exact archived cases
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: python experiments/round-80/factcg_control.py --out experiments/round-80/factcg-results.json
      - name: Upload derived metrics and checkpoint hashes only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdg-r80-factcg-controlled-support
          path: experiments/round-80/factcg-results.json
          if-no-files-found: ignore
