name: CDG R106 heldout QASPER mixed source layout archive
on:
  push:
    branches:
      - "research/round-106-*"
    paths:
      - "experiments/round-106/**"
      - ".github/workflows/cdg-r106-hybrid-history.yml"
  workflow_dispatch:
jobs:
  source-layout-policy-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned standard dictionary codec
        run: python -m pip install --disable-pip-version-check Brotli==1.1.0 zstandard==0.23.0
      - name: Fourteen original evidence and heldout-policy source regression tests
        run: python -W error::ResourceWarning -m unittest discover -s experiments/round-106 -p 'test_*.py' -v
      - name: Official QASPER real hybrid SQLite archive, hashed question heldout reads and synthetic revisions
        run: python experiments/round-106/trace_adaptive_archive.py --out experiments/round-106/ci-results.json
      - name: Retain aggregate original source, heldout access and source WAL cost artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdg-r106-real-hybrid-heldout-archive
          path: experiments/round-106/ci-results.json
          if-no-files-found: ignore
