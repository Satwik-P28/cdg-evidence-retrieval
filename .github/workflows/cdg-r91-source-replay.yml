name: CDG R91 source-only repair and process kill
on:
  push:
    branches:
      - "research/round-91-*"
    paths:
      - "experiments/round-91/**"
      - ".github/workflows/cdg-r91-source-replay.yml"
  workflow_dispatch:
jobs:
  source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run eight adversarial archive replay and process kill tests
        run: python -W error::ResourceWarning -m unittest discover -s experiments/round-91 -p 'test_*.py' -v
      - name: Full SHA-pinned SciFact FTS poisoning and source-only recovery
        run: python experiments/round-91/self_healing_archive.py --full --out experiments/round-91/ci-results.json
      - name: Preserve aggregates and errors only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdg-r91-repair-sigkill-probe-results
          path: experiments/round-91/ci-results.json
          if-no-files-found: ignore
