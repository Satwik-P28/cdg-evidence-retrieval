name: CDG R81 directionality and reverse negation stress test
on:
  push:
    branches:
      - "research/round-81-*"
    paths:
      - "experiments/round-81/**"
      - ".github/workflows/cdg-r81-directionality.yml"
  workflow_dispatch:
jobs:
  paired-relation-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned CPU pretrained model environment
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install --disable-pip-version-check lettucedetect==0.2.3 transformers==4.52.4 huggingface_hub==0.32.4 tokenizers==0.21.4 numpy==2.2.6 sentencepiece==0.2.0 protobuf==5.29.5
      - name: R81 semantic and order invariance regression tests
        run: python -W error::ResourceWarning -m unittest discover -s experiments/round-81 -p 'test_*.py' -v
      - name: Compare unchanged MiniCheck NLI FactCG Lettuce on matched source surface edits
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: python experiments/round-81/relation_ablation.py --out experiments/round-81/ci-results.json
      - name: Upload aggregate model outcomes without any model weights or raw data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdg-r81-sentence-directionality
          path: experiments/round-81/ci-results.json
          if-no-files-found: ignore
