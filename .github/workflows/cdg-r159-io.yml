name: CDG R159 matched archive physical IO
on:
  push:
    branches: ['research/round-159-*']
    paths: ['experiments/round-159/**','.github/workflows/cdg-r159-io.yml','research/rounds/round-159/**']
  workflow_dispatch:
jobs:
  io:
    strategy:
      fail-fast: false
      matrix:
        target: [10000, 100000]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install zstandard==0.25.0 gdown==5.2.0 pytest==9.0.2 pyflakes==3.4.0
      - run: python -m pyflakes experiments/round-159
      - run: cc -O3 -Wall -Wextra -Werror -shared -fPIC experiments/round-118/cdgfts.c -o experiments/round-118/cdgfts.so
      - run: PYTHONPATH=experiments/round-159 python -m pytest -q experiments/round-159
      - run: python experiments/round-136/download_source.py --out external/newsedits
      - run: python experiments/round-159/physical_io.py --source external/newsedits/ap.db --target ${{ matrix.target }} --extension experiments/round-118/cdgfts.so --out experiments/round-159/ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: cdg-r159-${{ matrix.target }}
          path: experiments/round-159/ci.json
