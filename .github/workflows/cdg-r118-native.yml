name: CDG R118 native frequency comparison
on:
  push:
    branches: ['research/round-118-*']
    paths: ['experiments/round-118/**','.github/workflows/cdg-r118-native.yml','research/rounds/round-118/**']
  pull_request:
    paths: ['experiments/round-118/**','.github/workflows/cdg-r118-native.yml','research/rounds/round-118/**']
  workflow_dispatch:
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install zstandard==0.25.0 pytest==9.0.2
      - name: Compile public FTS5 extension
        run: cc -O3 -Wall -Wextra -Werror -shared -fPIC experiments/round-118/cdgfts.c -o experiments/round-118/cdgfts.so
      - run: CDG_FTS_EXTENSION="$PWD/experiments/round-118/cdgfts.so" PYTHONPATH=experiments/round-118 python -m pytest -q experiments/round-118
      - uses: actions/checkout@v4
        with:
          repository: natwar-modani/versions
          ref: 06b32f753c4ac6fd154ffa8b5a9af2cd11b777c0
          path: external/versions
          persist-credentials: false
      - run: |
          test "$(git -C external/versions rev-parse HEAD)" = "06b32f753c4ac6fd154ffa8b5a9af2cd11b777c0"
          python experiments/round-118/native_compare.py --root external/versions/version_documents --extension experiments/round-118/cdgfts.so --out experiments/round-118/ci-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: cdg-r118-native
          path: experiments/round-118/ci-results.json
