name: CDG R82 evidence-window routing vs full NLI
on:
  push:
    branches:
      - "research/round-82-*"
    paths:
      - "experiments/round-82/**"
      - ".github/workflows/cdg-r82-witness-routing.yml"
  pull_request:
    branches:
      - main
    paths:
      - "experiments/round-82/**"
      - ".github/workflows/cdg-r82-witness-routing.yml"
  workflow_dispatch:
jobs:
  witness-policies:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed CPU model runtime
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install --disable-pip-version-check transformers==4.52.4 huggingface_hub==0.32.4 tokenizers==0.21.4 numpy==2.2.6 sentencepiece==0.2.0 protobuf==5.29.5
      - name: R82 frozen template, archive, candidate-policy and scoring contract tests
        run: python -W error::ResourceWarning -m unittest discover -s experiments/round-82 -p 'test_*.py' -v
      - name: R82 pretrained NLI models over original R80 and R81 source receipts
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: python experiments/round-82/sentence_witness.py --out experiments/round-82/ci-results.json
      - name: Retain aggregate paired outcomes, input costs and immutable model provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdg-r82-witness-routing-control
          path: experiments/round-82/ci-results.json
          if-no-files-found: ignore
