name: CDG strong compression controls
on:
  push:
    branches:
      - "research/round-60-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  strong-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned compression baseline dependency
        run: python -m pip install --disable-pip-version-check zstandard==0.25.0
      - name: Zstandard and Git archive regression tests
        run: python -W error::ResourceWarning -m unittest discover -s experiments/round-60 -p 'test_*.py' -v
      - name: Run Round 60 full authentic-source comparison
        run: python experiments/round-60/strong_controls.py --out experiments/round-60/ci-results.json
      - name: Round 61 frozen policy and mixture tests
        run: python -W error::ResourceWarning -m unittest discover -s experiments/round-61 -p 'test_*.py' -v
      - name: Round 61 source-mixture shift experiment
        run: python experiments/round-61/mix_shift.py --out experiments/round-61/ci-results.json
      - name: Upload numerical results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round60-strong-compression-results
          path: |
            experiments/round-60/ci-results.json
            experiments/round-61/ci-results.json
          if-no-files-found: ignore
