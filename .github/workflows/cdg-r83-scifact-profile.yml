name: CDG R83 SciFact independent data cohort preflight
on:
  push:
    branches:
      - "research/round-83-*"
    paths:
      - "experiments/round-83/**"
      - ".github/workflows/cdg-r83-scifact-profile.yml"
  workflow_dispatch:
jobs:
  scifact-data-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test official SciFact evidence contract and release parser offline
        run: python -m unittest discover -s experiments/round-83 -p 'test_scifact_data.py' -v
      - name: Verify upstream source and create deterministic disjoint train/dev cohorts
        run: python experiments/round-83/scifact_data.py --out experiments/round-83/profile.json
      - name: Preserve only schema, counts, upstream hash and sampling fingerprints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdg-r83-upstream-scifact-profile
          path: experiments/round-83/profile.json
          if-no-files-found: ignore
