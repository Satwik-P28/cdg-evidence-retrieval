name: CDG R174 selective materialization
on:
  push:
    branches: ['research/round-174-*']
    paths: ['experiments/round-174/**','experiments/round-173/**','.github/workflows/cdg-r174-selection.yml','research/rounds/round-174/**']
  workflow_dispatch:
jobs:
  selfindex:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {corpus: ap, target: 10000}
          - {corpus: ap, target: 100000}
          - {corpus: clark, target: 10000}
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install zstandard==0.25.0 gdown==5.2.0 pytest==9.0.2 pyflakes==3.4.0 rapidfuzz==3.14.3
      - run: python -m pyflakes experiments/round-173 experiments/round-174
      - run: cc -O3 -Wall -Wextra -Werror -shared -fPIC experiments/round-152/cdgfts.c -o experiments/round-152/cdgfts.so
      - run: cc -O3 -Wall -Wextra -Werror -shared -fPIC experiments/round-173/cdgbp.c -o experiments/round-173/cdgbp.so
      - run: CDG_FTS_EXTENSION="$PWD/experiments/round-152/cdgfts.so" PYTHONPATH=experiments/round-173:experiments/round-174 python -m pytest -q experiments/round-174
      - if: matrix.corpus == 'ap'
        run: python experiments/round-136/download_source.py --out external/newsedits
      - if: matrix.corpus == 'clark'
        run: |
          git init external/clark
          git -C external/clark remote add origin https://github.com/belindal/ERASE.git
          git -C external/clark fetch --depth=1 origin b93f898780b3cf40fedd4e9a00c51af9a27688bc
          git -C external/clark checkout --detach FETCH_HEAD
      - run: python experiments/round-174/cost_selection.py --corpus ${{ matrix.corpus }} --source external/${{ matrix.corpus == 'ap' && 'newsedits/ap.db' || 'clark' }} --target ${{ matrix.target }} --extension experiments/round-152/cdgfts.so --out experiments/round-174/ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: cdg-r174-${{ matrix.corpus }}-${{ matrix.target }}
          path: experiments/round-174/ci.json
