name: CDG R111 complete-vocabulary original-source BM25 posting store
on:
  push:
    branches:
      - 'research/round-111-*'
    paths:
      - 'experiments/round-111/**'
      - '.github/workflows/cdg-r111-full-bm25-index.yml'
  pull_request:
    paths:
      - 'experiments/round-111/**'
      - '.github/workflows/cdg-r111-full-bm25-index.yml'
  workflow_dispatch:
jobs:
  full-vocabulary-bm25:
    strategy:
      fail-fast: false
      matrix:
        dataset: [scifact, qasper]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reference tests
        run: python -m pip install --disable-pip-version-check pytest==9.0.2
      - name: Local and randomized fixtures across codecs, token frequencies and BM25
        run: python -m pytest -q experiments/round-111/tests
      - name: Original-source complete-vocabulary store and native FTS5 score differential
        run: python experiments/round-111/full_bm25_store.py --dataset ${{ matrix.dataset }} --out experiments/round-111/ci-${{ matrix.dataset }}.json
      - name: Upload source-frozen aggregate numeric artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdg-r111-${{ matrix.dataset }}-full-bm25
          path: experiments/round-111/ci-${{ matrix.dataset }}.json
          if-no-files-found: warn