name: CDG answer-QA model provenance probe
on:
  push:
    branches:
      - "research/round-66-*"
  workflow_dispatch:
jobs:
  model-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve immutable pre-trained QA model SHA and license
        run: python experiments/round-66/model_probe.py
