name: CDG R80 controlled-source MiniCheck vs NLI vs LettuceDetect
on:
  push:
    branches:
      - "research/round-80-*"
    paths:
      - "experiments/round-80/**"
      - ".github/workflows/cdg-r80-controlled-checkers.yml"
  workflow_dispatch:
jobs:
  controlled-grounding-checkers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin CPU PyTorch and published model runtime
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install --disable-pip-version-check lettucedetect==0.2.3 transformers==4.52.4 huggingface_hub==0.32.4 tokenizers==0.21.4 numpy==2.2.6 sentencepiece==0.2.0 protobuf==5.29.5
      - name: Test paired intervention, synthetic labels, byte receipts and metric contracts
        run: python -W error::ResourceWarning -m unittest discover -s experiments/round-80 -p 'test_*.py' -v
      - name: Run unchanged published pretrained models on exact archived controlled sources
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: python experiments/round-80/controlled_facts.py --out experiments/round-80/ci-results.json
      - name: Retain only aggregate accuracy, model cost, source SHA and template hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdg-r80-controlled-grounding-comparison
          path: experiments/round-80/ci-results.json
          if-no-files-found: ignore
