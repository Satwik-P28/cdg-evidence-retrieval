name: CDG R75 source swap grounding falsification
on:
  push:
    branches:
      - "research/round-75-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  source-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU NLI runtime
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check transformers==4.46.3 huggingface_hub==0.26.5 tokenizers==0.20.3 sentencepiece==0.2.0 numpy==1.26.4
      - name: R75 counterfactual source identity and no-label-leakage regression
        run: python -W error::ResourceWarning -m unittest discover -s experiments/round-75 -p 'test_*.py' -v
      - name: R75 matched-source vs nearest-distinct-source NLI inference
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: python experiments/round-75/source_swap.py --out experiments/round-75/ci-results.json
      - name: Save compact paired source-sensitivity and compute results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round75-counterfactual-source-sensitivity-results
          path: experiments/round-75/ci-results.json
          if-no-files-found: ignore
