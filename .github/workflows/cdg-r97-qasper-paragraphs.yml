name: CDG R97 independent QASPER paragraph retrieval equivalence
on:
  push:
    branches:
      - "research/round-97-*"
    paths:
      - "experiments/round-97/**"
      - ".github/workflows/cdg-r97-qasper-paragraphs.yml"
  workflow_dispatch:
jobs:
  qasper-paragraph-recall:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Nine original source and gold paragraph scope regressions
        run: python -W error::ResourceWarning -m unittest discover -s experiments/round-97 -p 'test_*.py' -v
      - name: Frozen official QASPER 0.3 dev paragraphs 1005 question same-source FTS differential
        run: python experiments/round-97/qasper_paragraph_retrieval.py --out experiments/round-97/ci-results.json
      - name: Save aggregate paper-scoped source bytes and evidence Recall
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdg-r97-qasper-paragraph-qa
          path: experiments/round-97/ci-results.json
          if-no-files-found: ignore
