name: CDG R125 fragment positional index
on:
  push:
    branches: ['research/round-125-*']
    paths: ['experiments/round-125/**','.github/workflows/cdg-r125-fragments.yml','research/rounds/round-125/**']
  pull_request:
    paths: ['experiments/round-125/**','.github/workflows/cdg-r125-fragments.yml','research/rounds/round-125/**']
  workflow_dispatch:
jobs:
  fragments:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install zstandard==0.25.0 pytest==9.0.2
      - run: |
          cc -O3 -Wall -Wextra -Werror -shared -fPIC experiments/round-118/cdgfts.c -o experiments/round-118/cdgfts.so
          cc -O3 -Wall -Wextra -Werror -shared -fPIC experiments/round-125/cdgpos.c -o experiments/round-125/cdgpos.so
      - run: CDG_FTS_EXTENSION="$PWD/experiments/round-118/cdgfts.so" CDG_POS_EXTENSION="$PWD/experiments/round-125/cdgpos.so" PYTHONPATH=experiments/round-125 python -m pytest -q experiments/round-125
      - uses: actions/checkout@v4
        with:
          repository: natwar-modani/versions
          ref: 06b32f753c4ac6fd154ffa8b5a9af2cd11b777c0
          path: external/versions
          persist-credentials: false
      - run: |
          test "$(git -C external/versions rev-parse HEAD)" = "06b32f753c4ac6fd154ffa8b5a9af2cd11b777c0"
          python experiments/round-125/fragment_index.py --root external/versions/version_documents --extension experiments/round-118/cdgfts.so --position-extension experiments/round-125/cdgpos.so --out experiments/round-125/ci-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: cdg-r125-fragments
          path: experiments/round-125/ci-results.json
