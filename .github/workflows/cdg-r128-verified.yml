name: CDG R128 verified ranking
on:
  push:
    branches: ['research/round-128-*']
    paths: ['experiments/round-128/**','.github/workflows/cdg-r128-verified.yml','research/rounds/round-128/**']
  pull_request:
    paths: ['experiments/round-128/**','.github/workflows/cdg-r128-verified.yml','research/rounds/round-128/**']
  workflow_dispatch:
jobs:
  verified:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install zstandard==0.25.0 pytest==9.0.2
      - run: cc -O3 -Wall -Wextra -Werror -shared -fPIC experiments/round-118/cdgfts.c -o experiments/round-118/cdgfts.so
      - run: PYTHONPATH=experiments/round-128 python -m pytest -q experiments/round-128
      - uses: actions/checkout@v4
        with:
          repository: natwar-modani/versions
          ref: 06b32f753c4ac6fd154ffa8b5a9af2cd11b777c0
          path: external/versions
          persist-credentials: false
      - run: |
          test "$(git -C external/versions rev-parse HEAD)" = "06b32f753c4ac6fd154ffa8b5a9af2cd11b777c0"
          python experiments/round-128/verified_rank.py --root external/versions/version_documents --extension experiments/round-118/cdgfts.so --out experiments/round-128/ci-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: cdg-r128-verified
          path: experiments/round-128/ci-results.json
