name: CDG R79 trained detector evidence source perturbations
on:
  push:
    branches:
      - "research/round-79-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  trained-source-perturbation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin CPU trained-detector runtime
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install --disable-pip-version-check lettucedetect==0.2.3 transformers==4.52.4 huggingface_hub==0.32.4 tokenizers==0.21.4 numpy==2.2.6
      - name: Source-only alternative ranking and grouped-bootstrap tests
        run: python -W error::ResourceWarning -m unittest discover -s experiments/round-79 -p 'test_*.py' -v
      - name: Fixed human-annotated answers, real pretrained detector and altered sources
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: python experiments/round-79/trained_source_swap.py --out experiments/round-79/ci-results.json
      - name: Keep only aggregate sensitivity costs and sample SHA hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round79-trained-detector-source-sensitivity
          path: experiments/round-79/ci-results.json
          if-no-files-found: ignore
