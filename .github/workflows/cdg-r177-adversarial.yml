name: CDG R177 adversarial
on:
  push:
    branches: ['research/round-177-*']
    paths: ['experiments/round-177/**','.github/workflows/cdg-r177-adversarial.yml','research/rounds/round-177/**']
  workflow_dispatch:
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install zstandard==0.25.0 pytest==9.0.2 pyflakes==3.4.0 rapidfuzz==3.14.3 gdown==5.2.0
      - run: python -m pyflakes experiments/round-177
      - run: cc -O3 -Wall -Wextra -Werror -shared -fPIC experiments/round-152/cdgfts.c -o experiments/round-152/cdgfts.so
      - run: CDG_FTS_EXTENSION="$PWD/experiments/round-152/cdgfts.so" PYTHONPATH=experiments/round-173 python experiments/round-177/adversarial.py --corpus synthetic --extension experiments/round-152/cdgfts.so --out experiments/round-177/synthetic.json
      - uses: actions/upload-artifact@v4
        with:
          name: cdg-r177-synthetic
          path: experiments/round-177/synthetic.json
  corpus:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {corpus: ap, target: 10000}
          - {corpus: clark, target: 10000}
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install zstandard==0.25.0 pytest==9.0.2 pyflakes==3.4.0 rapidfuzz==3.14.3 gdown==5.2.0
      - run: cc -O3 -Wall -Wextra -Werror -shared -fPIC experiments/round-152/cdgfts.c -o experiments/round-152/cdgfts.so
      - if: matrix.corpus == 'ap'
        run: python experiments/round-136/download_source.py --out external/newsedits
      - if: matrix.corpus == 'clark'
        run: |
          git init external/clark
          git -C external/clark remote add origin https://github.com/belindal/ERASE.git
          git -C external/clark fetch --depth=1 origin b93f898780b3cf40fedd4e9a00c51af9a27688bc
          git -C external/clark checkout --detach FETCH_HEAD
      - run: CDG_FTS_EXTENSION="$PWD/experiments/round-152/cdgfts.so" PYTHONPATH=experiments/round-173 python experiments/round-177/adversarial.py --corpus ${{ matrix.corpus }} --source external/${{ matrix.corpus == 'ap' && 'newsedits/ap.db' || 'clark' }} --target ${{ matrix.target }} --reps 5 --extension experiments/round-152/cdgfts.so --out experiments/round-177/ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: cdg-r177-${{ matrix.corpus }}
          path: experiments/round-177/ci.json
