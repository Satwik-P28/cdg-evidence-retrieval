name: CDG R83 real SciFact scientific-claim verifier comparison
on:
  push:
    branches:
      - "research/round-83-*"
    paths:
      - "experiments/round-83/**"
      - ".github/workflows/cdg-r83-scifact-models.yml"
  workflow_dispatch:
jobs:
  human-annotated-scifact-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin pretrained CPU inference environment and TF-IDF comparator
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install --disable-pip-version-check lettucedetect==0.2.3 transformers==4.52.4 huggingface_hub==0.32.4 tokenizers==0.21.4 numpy==2.2.6 sentencepiece==0.2.0 protobuf==5.29.5 scikit-learn==1.6.1
      - name: Validate independent data contract and paired model scoring policies
        run: python -W error::ResourceWarning -m unittest discover -s experiments/round-83 -p 'test_*.py' -v
      - name: Evaluate fixed and train-calibrated published verifiers on SciFact dev
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: python experiments/round-83/real_grounding.py --out experiments/round-83/ci-results.json
      - name: Upload aggregate accuracy, source hashes, retrieval and CPU-token costs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdg-r83-real-scifact-human-claim-results
          path: experiments/round-83/ci-results.json
          if-no-files-found: ignore
