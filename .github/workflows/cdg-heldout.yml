name: CDG held-out evidence evaluation
on:
  push:
    branches:
      - "research/round-54-*"
      - "research/round-55-*"
      - "research/round-56-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  heldout-hotpot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Round 25 and Round 53 historical baseline regressions
        run: |
          python -W error::ResourceWarning -m unittest discover -s experiments/round-25 -p 'test_*.py' -v
          python -W error::ResourceWarning -m unittest discover -s experiments/round-53 -p 'test_*.py' -v
      - name: Round 54 policy tests
        run: python -W error::ResourceWarning -m unittest discover -s experiments/round-54 -p 'test_*.py' -v
      - name: SHA-verified independent dev set evaluation, locked 512 questions
        run: python experiments/round-54/heldout_dev.py --out experiments/round-54/ci-results.json
      - name: Round 55 compressed evidence retrieval regression tests
        run: python -W error::ResourceWarning -m unittest discover -s experiments/round-55 -p 'test_*.py' -v
      - name: Round 55 exact source-span retrieval and frame budget
        run: python experiments/round-55/heldout_frames.py --sample-size 128 --out experiments/round-55/ci-results.json
      - name: Round 56 sentence retrieval policy regression tests
        run: python -W error::ResourceWarning -m unittest discover -s experiments/round-56 -p 'test_*.py' -v
      - name: Round 56 sentence budget and title-link ablation
        run: python experiments/round-56/sentence_policy.py --sample-size 128 --out experiments/round-56/ci-results.json
      - name: Round 57 cross-document sentence budget tests
        run: python -W error::ResourceWarning -m unittest discover -s experiments/round-57 -p 'test_*.py' -v
      - name: Round 57 two-partition global evidence budget benchmark
        run: python experiments/round-57/budget_router.py --out experiments/round-57/ci-results.json
      - name: Round 58 mixed-source archive regression tests
        run: python -W error::ResourceWarning -m unittest discover -s experiments/round-58 -p 'test_*.py' -v
      - name: Round 58 online mixed-source archive cost ablation
        run: python experiments/round-58/mixed_archive.py --out experiments/round-58/ci-results.json
      - name: Round 59 frozen budget confirmation tests
        run: python -W error::ResourceWarning -m unittest discover -s experiments/round-59 -p 'test_*.py' -v
      - name: Round 59 confirmation on remaining 256 locked dev questions
        run: python experiments/round-59/confirm_budget.py --out experiments/round-59/ci-results.json
      - name: Attach traceable numerical results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heldout-r54-research-results
          path: |
            experiments/round-54/ci-results.json
            experiments/round-55/ci-results.json
            experiments/round-56/ci-results.json
            experiments/round-57/ci-results.json
            experiments/round-58/ci-results.json
            experiments/round-59/ci-results.json
          if-no-files-found: ignore
